[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-soc"
version = "0.1.0"
description = "Read-only, evidence-first SOC investigation tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
server = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "psycopg[binary]>=3.3,<4",
    "cryptography>=46,<49",
    "argon2-cffi>=25,<26",
]
dev = ["ruff>=0.9", "httpx2>=2.16,<3"]

[project.scripts]
corvus = "corvus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corvus.server" = ["schema.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
